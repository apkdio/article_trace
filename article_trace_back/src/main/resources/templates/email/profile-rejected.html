<!DOCTYPE html>
<!--
  文迹 · 昵称/个签审核未通过邮件模板（HTML 载体）

  占位符：nickname 用户昵称、reason 拒绝理由、logoUrl 品牌 logo、year 版权年份。
  用户输入由 NotificationServiceImpl 渲染前做 HTML 转义，这里直接输出。
  邮件客户端会剥离 <style>、不支持 flex/grid，因此用 table 布局 + 内联样式，宽 600px。
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="x-apple-disable-message-reformatting">
  <title>文迹 · 昵称未通过审核</title>
</head>
<body style="margin:0;padding:0;background-color:#f5f5f5;-webkit-text-size-adjust:100%;">

  <div style="display:none;max-height:0;overflow:hidden;opacity:0;color:#f5f5f5;font-size:1px;">
    你提交的昵称未能通过审核，原因：{{reason}}
  </div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
         style="background-color:#f5f5f5;">
    <tr>
      <td align="center" style="padding:32px 12px;">

        <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"
               style="width:600px;max-width:600px;background-color:#ffffff;">

          <tr>
            <td style="padding:36px 40px 0 40px;">
              <img src="{{logoUrl}}" width="150" height="60" alt="文迹"
                   style="display:block;border:0;outline:none;width:150px;height:60px;">
            </td>
          </tr>

          <tr>
            <td style="padding:32px 40px 0 40px;
                       font-family:'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;
                       font-size:14px;line-height:1.6;color:#333333;">
              你好，{{nickname}}：<br>
              你提交的昵称未能通过审核。
            </td>
          </tr>

          <tr>
            <td style="padding:16px 40px 0 40px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
                     style="background-color:#fafafa;border-left:3px solid #d9d9d9;">
                <tr>
                  <td style="padding:14px 16px;
                             font-family:'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;
                             font-size:14px;line-height:1.6;color:#555555;">
                    <span style="color:#999999;">原因：</span><br>
                    {{reason}}
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <tr>
            <td style="padding:16px 40px 0 40px;
                       font-family:'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;
                       font-size:14px;line-height:1.6;color:#333333;">
              你现在的昵称不受影响，可以换一个再提交。
            </td>
          </tr>

          <tr>
            <td style="padding:36px 40px 40px 40px;
                       font-family:'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;
                       font-size:14px;line-height:1.6;color:#333333;">
              感谢你的使用，<br>ArticleTrace Team
            </td>
          </tr>

        </table>

        <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"
               style="width:600px;max-width:600px;">
          <tr>
            <td align="center" style="padding:20px 40px 0 40px;
                       font-family:'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;
                       font-size:12px;line-height:1.8;color:#999999;">
              此邮件由系统自动生成，请勿直接回复！<br>
              &copy; {{year}} ArticleTrace &middot; MIT License
            </td>
          </tr>
        </table>

      </td>
    </tr>
  </table>

</body>
</html>
