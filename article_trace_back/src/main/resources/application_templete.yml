spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  data:
    redis:
      database: 0
      articleDB: 1
      port: 6379
      host: localhost
      timeout: 1500
      lettuce:
        shutdown-timeout: 100ms
        pool:
          max-wait: 2s
        cluster:
          refresh:
            adaptive: false
      viewKey: "article:view"
      infoKey: "article:info"
      password: ${REDIS_PASSWORD} # redis密码，无则删除该行
  mail:
    host: ${MAIL_HOST:smtp.qq.com}    # SMTP 服务器
    port: ${MAIL_PORT:465}            # 465=SMTPS；587 用 STARTTLS
    username: ${MAIL_USERNAME}        # 发件邮箱
    password: ${MAIL_PASSWORD}        # SMTP 授权码（非邮箱登录密码）
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.timeout: 5000
      mail.smtp.connectiontimeout: 5000
  tokenCheck:
    # 不同用户组的访问权限
    excludeUrls: /user/login, /user/register,/user/forgetPass,/error,/user/email/code
    notAllowUrl:
      writer: /user/accountManage,/user/articleManage,/user/delete/**,/article/assess,/article/manageArticles,/article/count,/user/boostType
      reader: /category/**,/article/**
  application:
    name: articleTraceBack
    admin:
      enableAutoConfig: true
      defaultUser: ${DEFAULT_USER_ID} # 默认用户名
      defaultPass: ${DEFAULT_USER_PASS} # 默认密码
      defaultResetPass: ${DEFAULT_USER_RESET_PASS} # 默认重置密码
      defaultEmail: ${DEFAULT_USER_EMAIL} # 默认邮箱
      defaultNickName: ${DEFAULT_USER_NICK_NAME} # 默认昵称
  datasource:
    url: ${DB_CONNECT_URL} # 数据库连接地址（MySQL）
    username: ${DB_USER} # 数据库用户名
    password: ${DB_PASSWORD} # 数据库密码
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      auto-commit: true
      pool-name: hikariPool
logging:
  level:
    root: INFO
    com.boot_pro.demo_work: DEBUG
    org.springframework.web: DEBUG
    com.articleTraceBack.mapper: DEBUG
JWT:
  Secure_KEY: ${JWT_SECURE_KEY} # JWT加密密钥
  longTime: 259200000 # 72小时
  shortTime: 86400000 # 毫秒（24小时）
Password:
  character: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789"
  masterPass: ${MASTER_PASS} # 站长密码
S3:
  endpoint: ${RUSTFS_ENDPOINT} # rustfs存储服务端地址
  accessKey: ${RUSTFS_ACCESS_KEY} # rustfs存储服务端密钥（登录用户名）
  secretKey: ${RUSTFS_SECRET_KEY} # rustfs存储服务端密钥（登录密码）
  picBucket: "pic" # 图片存储桶
  contentBucket: "content" # 文章内容存储桶
thumbnail:
  backfill:
    enabled: false          # 存量缩略图补齐（一次性，需要时置 true）
rpc:
  agent:
    enabled: true                 # 总开关：false 时 agent 全部降级（不建连、不写同步/会话数据）
    host: ${AGENT_HOST:localhost} # Python Agent gRPC 服务地址
    port: ${AGENT_PORT:50051}     # Python Agent gRPC 端口
    sessionKeyPrefix: "agent:session:user:"  # 用户↔会话归属索引 key 前缀（Redis Set，注销时联动清理）
    sync:
      enabled: true                          # 是否启用知识库定时批量同步
      cron: "0 */5 * * * ?"                  # 增量同步：每 5 分钟检查一次
      fullSyncCron: "0 0 1 * * ?"            # 全量对账：每天凌晨 1 点
      batchSize: 100                          # 每批最多推送的文章数
      ingestKey: "agent:ingest:pending"      # 待入库/更新文章 id 集合
      deleteKey: "agent:delete:pending"      # 待删除文章 id 集合
sensitive_word:
  filePath: ./res/sensitive_words.txt
  cron: "0 */30 * * * ?"
scheduler:
  # Redis同步MySQL任务
  sync:
    enabled: true
    cron: "0 */10 * * * ?"   # 每 10 分钟执行一次
email:
  from: ${MAIL_FROM:}            # 发件人，留空则用 spring.mail.username
  testTo: ${MAIL_TEST_TO:}       # 发信链路测试的默认收件人
  subjectPrefix: "[文迹]"        # 邮件主题前缀
author-apply:
  remindCron: "0 0 0/12 * * ?"   # 每 12 小时检查是否有待审作者申请，有则邮件提醒站长
notification:
  scenes:                        # 场景 → 投递渠道: inbox(仅站内) / mail(仅邮件) / both / none
    author-apply-submitted: both
    author-apply-approved: inbox
    author-apply-rejected: inbox
    author-apply-remind: mail
    email-code: mail
  defaultChannel: inbox          # 未配置场景的默认渠道
  mail:
    enabled: true                # 邮件渠道总开关（关闭后 mail/both 降级为仅站内）
    maxRetry: 2                  # 邮件最多重发次数
    retryCron: "0 */10 * * * ?"  # 失败邮件重试扫描
  cleanup:
    cron: "0 0 3 * * ?"          # 站内信清理任务
    keepDays: 30                 # 站内信保留天数
