# 站点功能开关：三项全关即「单用户态」（个人博客形态），用于个人 ICP 备案。
# 默认全开 = 本地开发的多用户态；线上由 .env 注入 false 切换，不必切分支、不必改代码。
site:
  register-enabled: true          # 注册接口 + 发码接口的 register 场景
  comment-enabled: true           # 新增评论（历史评论照常展示）
  author-apply-enabled: true      # 申请成为作者
  display-name: 文迹              # 站点显示名（浏览器标题与页脚）；线上填备案的网站名称
  logo-enabled: true              # 站内是否展示 logo（首页/详情页页头）；线上做备案时通常置 false

profile:
  # 昵称 / 个签里禁止出现的冒充站方身份的词，逗号分隔。只拦「像官方口径」的词，
  # 不是违禁词表（违禁词在 sensitive_word 那份外部文件里）；站名另由 site.display-name 兜底
  impersonation-words: 站长,管理员,管理員,官方,客服,认证

spring:
  servlet:
    multipart:
      # 单文件上限只约束「封面/头像」这类文件部件；应用层还有更严的 2MB 校验，会给出友好提示
      max-file-size: 3MB
      # 整个 multipart 请求的上限 = 正文 JSON + 封面。原先的 2MB 会让稍长的文章直接保存失败
      # （2026-09-17 线上 PATCH /api/article/update/65 就是这个原因）。必须小于 nginx 的
      # client_max_body_size，否则用户看到的是裸 413 页而不是应用层提示。
      max-request-size: 10MB
  data:
    redis:
      database: 0        # token / 验证码 / 限流计数所在的库（测试环境用独立库隔离）
      articleDB: 1       # 文章浏览量、热点缓存所在的库
      port: 6379
      host: localhost
      timeout: 1500
      lettuce:
        shutdown-timeout: 100ms
        pool:
          max-wait: 2s
        cluster:
          refresh:
            adaptive: false
      viewKey: "article:view"
      password: ${REDIS_PASSWORD} # redis密码，无则删除该行
  mail:
    host: ${MAIL_HOST:smtp.qq.com}    # SMTP 服务器
    port: ${MAIL_PORT:465}            # 465=SMTPS；587 用 STARTTLS
    username: ${MAIL_USERNAME}        # 发件邮箱
    password: ${MAIL_PASSWORD}        # SMTP 授权码（非邮箱登录密码）
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.timeout: 5000
      mail.smtp.connectiontimeout: 5000
  tokenCheck:
    # 不同用户组的访问权限
    excludeUrls: /user/login, /user/register,/user/forgetPass,/error,/user/email/code,/user/captcha
    notAllowUrl:
      writer: /user/accountManage,/user/articleManage,/user/delete/**,/article/assess,/article/manageArticles,/article/count,/user/changeType,/applyAuthor/manage,/avatar/manage,/profile/manage,/report/manage,/review
      reader: /category/**,/article/**,/applyAuthor/manage,/avatar/manage,/profile/manage,/report/manage,/review
  application:
    name: articleTraceBack
    admin:
      enableAutoConfig: true
      defaultUser: ${DEFAULT_USER_ID} # 默认用户名
      defaultPass: ${DEFAULT_USER_PASS} # 默认密码
      defaultEmail: ${DEFAULT_USER_EMAIL} # 默认邮箱
      defaultNickName: ${DEFAULT_USER_NICK_NAME} # 默认昵称
  datasource:
    url: ${DB_CONNECT_URL} # 数据库连接地址（MySQL）
    username: ${DB_USER} # 数据库用户名
    password: ${DB_PASSWORD} # 数据库密码
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      auto-commit: true
      pool-name: hikariPool
logging:
  level:
    root: INFO
    com.articleTraceBack: DEBUG
    org.springframework.web: DEBUG
    com.articleTraceBack.mapper: DEBUG
JWT:
  Secure_KEY: ${JWT_SECURE_KEY} # JWT加密密钥
  longTime: 259200000 # 72小时
  shortTime: 86400000 # 毫秒（24小时）
  # 令牌 Cookie 是否只在 HTTPS 下发送；站点上了 HTTPS 后应设为 true
  cookieSecure: ${JWT_COOKIE_SECURE:false}
Password:
  masterPass: ${MASTER_PASS} # 站长密码
S3:
  endpoint: ${RUSTFS_ENDPOINT} # rustfs存储服务端地址
  accessKey: ${RUSTFS_ACCESS_KEY} # rustfs存储服务端密钥（登录用户名）
  secretKey: ${RUSTFS_SECRET_KEY} # rustfs存储服务端密钥（登录密码）
  picBucket: "pic" # 图片存储桶（封面等既有图片）
  contentBucket: "content" # 文章内容存储桶
  avatarBucket: "avatar" # 头像待审存储桶
thumbnail:
  backfill:
    enabled: false          # 存量缩略图补齐（一次性，需要时置 true）
rpc:
  agent:
    enabled: true                 # 总开关：false 时 agent 全部降级（不建连、不写同步/会话数据）
    host: ${AGENT_HOST:localhost} # Python Agent gRPC 服务地址
    port: ${AGENT_PORT:50051}     # Python Agent gRPC 端口
    sessionKeyPrefix: "agent:session:user:"  # 用户↔会话归属索引 key 前缀（Redis Set，注销时联动清理）
    sync:
      enabled: true                          # 是否启用知识库定时批量同步
      cron: "0 */5 * * * ?"                  # 增量同步：每 5 分钟检查一次
      fullSyncCron: "0 0 1 * * ?"            # 全量对账：每天凌晨 1 点
      batchSize: 100                          # 每批最多推送的文章数
      ingestKey: "agent:ingest:pending"      # 待入库/更新文章 id 集合
      deleteKey: "agent:delete:pending"      # 待删除文章 id 集合
sensitive_word:
  filePath: ./res/sensitive_words.txt
  cron: "0 */30 * * * ?"
scheduler:
  # Redis同步MySQL任务
  sync:
    enabled: true
    cron: "0 */10 * * * ?"   # 每 10 分钟执行一次
email:
  from: ${MAIL_FROM:}            # 发件人，留空则用 spring.mail.username
  subjectPrefix: "[文迹]"        # 邮件主题前缀
  # 邮件模板里的 logo 地址。必须是**公网可访问的绝对 URL** ——
  # 邮件客户端读不到项目内的相对路径，本地路径在收件人那里会显示成裂图。
  logoUrl: ${MAIL_LOGO_URL:}
author-apply:
  remindCron: "0 0 0/12 * * ?"   # 每 12 小时检查是否有待审作者申请，有则邮件提醒站长
notification:
  scenes:                        # 场景 → 投递渠道: inbox(仅站内) / mail(仅邮件) / both / none
    author-apply-submitted: both
    author-apply-approved: inbox
    author-apply-rejected: inbox
    author-apply-remind: mail
    avatar-submitted: both
    avatar-approved: inbox
    avatar-rejected: both
    avatar-remind: mail
    profile-approved: inbox
    profile-rejected: both
    report-submitted: both
    report-handled: inbox
    report-rejected: inbox
    report-notice: inbox
    email-code: mail
  defaultChannel: inbox          # 未配置场景的默认渠道
  mail:
    enabled: true                # 邮件渠道总开关（关闭后 mail/both 降级为仅站内）
    maxRetry: 2                  # 邮件最多重发次数
    retryCron: "0 */10 * * * ?"  # 失败邮件重试扫描
  cleanup:
    cron: "0 0 3 * * ?"          # 站内信清理任务
    keepDays: 30                 # 站内信保留天数
