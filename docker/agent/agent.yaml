# =============================================================================
# 容器内 agent 配置（compose 挂载为 /app/config/agent.yaml）
#
# 本文件的值是容器的**兜底默认**：compose 会透传 LLM_* 环境变量，load_config
# 读取时用它们覆盖本文件（见 tools/config_tool.py）。两机部署（Ollama 单独跑在
# 另一台机器）时改 .env 里的 LLM_BASE_URL 即可，不必改这个文件。
# =============================================================================

# LLM 设置
llm:
  model: qwen2.5:7b
  base_url: http://ollama:11434/v1
  api_key: ollama
  temperature: 0.3
  max_tokens: 1024

# 行为开关
behavior:
  retrieval_only: false   # true=直接返回检索片段原文；false=走 LLM 生成答案
  verbose_log: false
