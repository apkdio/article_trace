# =============================================================================
# 容器内向量库配置（compose 挂载为 /app/config/chroma.yaml）
#
# 本文件的值是容器的**兜底默认**：compose 会透传 EMBED_* / LLM_* 环境变量，
# load_config 读取时用它们覆盖本文件（见 tools/config_tool.py）。
# =============================================================================

# 持久化目录（相对容器内项目根目录，已挂载 agent-data 卷）
persist_dir: data/vector_store

# 向量集合名称
collection_name: article_kb

# Embedding 模型（Ollama，OpenAI 兼容端点）
embedding:
  base_url: http://ollama:11434/v1
  api_key: ollama
  model: bge-m3
