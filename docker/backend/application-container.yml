# =============================================================================
# 容器内后端配置（compose 挂载为 /app/config/application.yml）
# 优先级高于镜像内 classpath 配置，所有外部依赖均指向 compose 服务名。
# 凭据类项（密码 / 密钥）故意不设默认值，必须由 compose 从 .env 注入；
# 缺失时应用启动即报错，便于尽早暴露配置问题。
# =============================================================================

# 站点功能开关：三项传 false 即单用户态（个人备案口径：不涉及企业、团体、论坛）
site:
  register-enabled: ${SITE_REGISTER_ENABLED:true}
  comment-enabled: ${SITE_COMMENT_ENABLED:true}
  author-apply-enabled: ${SITE_AUTHOR_APPLY_ENABLED:true}
  display-name: ${SITE_DISPLAY_NAME:文迹}
  logo-enabled: ${SITE_LOGO_ENABLED:true}

spring:
  servlet:
    multipart:
      # 单文件上限只约束「封面/头像」这类文件部件；应用层还有更严的 2MB 校验，会给出友好提示
      max-file-size: 3MB
      # 整个 multipart 请求的上限 = 正文 JSON + 封面。原先的 2MB 会让稍长的文章直接保存失败
      # （2026-09-17 线上 PATCH /api/article/update/65 就是这个原因）。必须小于 nginx 的
      # client_max_body_size，否则用户看到的是裸 413 页而不是应用层提示。
      max-request-size: 10MB
  data:
    redis:
      database: 0
      articleDB: 1
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: 1500
      password: ${REDIS_PASSWORD}
      viewKey: "article:view"
      infoKey: "article:info"
      lettuce:
        shutdown-timeout: 100ms
        pool:
          max-wait: 2s
        cluster:
          refresh:
            adaptive: false
  mail:
    host: ${MAIL_HOST:smtp.qq.com}      # SMTP 服务器
    port: ${MAIL_PORT:465}              # 465=SMTPS；587 用 STARTTLS
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}          # SMTP 授权码（非邮箱登录密码）
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.timeout: 5000
      mail.smtp.connectiontimeout: 5000
  tokenCheck:
    # 不同用户组的访问权限
    excludeUrls: /user/login, /user/register,/user/forgetPass,/error,/user/email/code,/user/captcha
    notAllowUrl:
      writer: /user/accountManage,/user/articleManage,/user/delete/**,/article/assess,/article/manageArticles,/article/count,/user/changeType,/applyAuthor/manage,/avatar/manage,/report/manage,/review
      reader: /category/**,/article/**,/applyAuthor/manage,/avatar/manage,/report/manage,/review
  application:
    name: articleTraceBack
    admin:
      enableAutoConfig: true
      defaultUser: ${DEFAULT_USER_ID:apkdio}
      defaultPass: ${DEFAULT_USER_PASS}
      defaultEmail: ${DEFAULT_USER_EMAIL:article_trace@trace.com}
      defaultNickName: ${DEFAULT_USER_NICK_NAME:测试昵称}
  datasource:
    url: "${DB_CONNECT_URL:jdbc:mysql://mysql:3306/article_trace?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}"
    username: ${DB_USER:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      auto-commit: true
      pool-name: hikariPool

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    com.articleTraceBack.mapper: DEBUG

JWT:
  Secure_KEY: ${JWT_SECURE_KEY}
  longTime: 259200000     # 72 小时
  shortTime: 86400000     # 24 小时
  # 令牌 Cookie 是否只在 HTTPS 下发送；站点上了 HTTPS 后在 .env 里置 true
  cookieSecure: ${JWT_COOKIE_SECURE:false}

Password:
  masterPass: ${MASTER_PASS}

S3:
  endpoint: ${RUSTFS_ENDPOINT:http://rustfs:9000}
  accessKey: ${RUSTFS_ACCESS_KEY}
  secretKey: ${RUSTFS_SECRET_KEY}
  picBucket: ${RUSTFS_PIC_BUCKET:pic} # 图片存储桶（封面等既有图片）
  contentBucket: ${RUSTFS_CONTENT_BUCKET:content} # 文章内容存储桶
  avatarBucket: ${RUSTFS_AVATAR_BUCKET:avatar} # 头像待审存储桶

thumbnail:
  backfill:
    enabled: false        # 存量缩略图补齐：需要时一次性置 true

rpc:
  agent:
    enabled: ${AGENT_ENABLED:true}        # false 时 agent 全部降级，主业务不受影响
    host: ${AGENT_HOST:agent}
    port: ${AGENT_PORT:50051}
    sessionKeyPrefix: "agent:session:user:"
    sync:
      enabled: true
      cron: "0 */5 * * * ?"               # 增量同步：每 5 分钟
      fullSyncCron: "0 0 1 * * ?"         # 全量对账：每天凌晨 1 点
      batchSize: 100
      ingestKey: "agent:ingest:pending"
      deleteKey: "agent:delete:pending"

email:
  from: ${MAIL_FROM:}                   # 发件人，留空则用 spring.mail.username
  subjectPrefix: "[文迹]"
  logoUrl: ${MAIL_LOGO_URL:}            # 邮件模板 logo 地址；推荐 https://域名/logo2.png（由 Nginx 托管）

author-apply:
  remindCron: "0 0 0/12 * * ?"          # 每 12 小时检查待审作者申请，有则邮件提醒站长

notification:
  scenes:                               # 场景 → 渠道：inbox(仅站内) / mail(仅邮件) / both / none
    author-apply-submitted: both
    author-apply-approved: inbox
    author-apply-rejected: inbox
    author-apply-remind: mail
    avatar-submitted: both
    avatar-approved: inbox
    avatar-rejected: both
    avatar-remind: mail
    report-submitted: both
    report-handled: inbox
    report-rejected: inbox
    report-notice: inbox
    email-code: mail
  defaultChannel: inbox
  mail:
    enabled: true
    maxRetry: 2                         # 邮件最多重发次数
    retryCron: "0 */10 * * * ?"        # 失败邮件重试扫描
  cleanup:
    cron: "0 0 3 * * ?"                # 站内信清理任务
    keepDays: 30                       # 站内信保留天数

sensitive_word:
  # 外部词库不存在时自动降级到 classpath 内置词库；如需挂载，在 backend 服务的 volumes 加 ./res:/app/res
  filePath: ./res/sensitive_words.txt
  cron: "0 */30 * * * ?"

scheduler:
  sync:
    enabled: true
    cron: "0 */10 * * * ?"                # Redis 浏览量 → MySQL
