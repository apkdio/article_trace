# =============================================================================
# 前端 Nginx 配置：托管 Vue 构建产物 + 反向代理后端
# =============================================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传封面/头像上限 5MB，放宽 nginx 默认的 1MB
    client_max_body_size 10m;

    # /api/xxx → http://backend:8080/xxx
    # 与本地开发时 Vite 代理的 rewrite（去掉 /api 前缀）保持一致
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式问答（/api/agent/ask）必须关闭缓冲，
        # 否则 Nginx 会把 LLM 增量攒成一批再返回，失去打字机效果
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SPA 前端路由：刷新子路径时回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
