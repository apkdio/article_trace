# =============================================================================
# 前端 Nginx 配置：托管 Vue 构建产物 + 反向代理后端
# =============================================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 请求体上限必须大于后端的 spring.servlet.multipart.max-request-size（现为 10MB）：
    # 反过来的话，刚超限的请求会先被这层拦成裸 413 页，而不是应用层那句友好提示。
    # 原先设 3m 是按「上传封面/头像」估的，但文章保存走的是同一个 multipart 通道
    # （正文 JSON + 封面一次性提交），正文稍长就会在这里被拦
    # —— 2026-09-17 20:02 线上 PATCH /api/article/update/65（3712578 bytes）就是这么失败的。
    client_max_body_size 11m;

    # /api/xxx → http://backend:8080/xxx
    # 与本地开发时 Vite 代理的 rewrite（去掉 /api 前缀）保持一致
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式问答（/api/agent/ask）必须关闭缓冲，
        # 否则 Nginx 会把 LLM 增量攒成一批再返回，失去打字机效果
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SPA 前端路由：刷新子路径时回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
